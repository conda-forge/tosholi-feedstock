schema_version: 1

context:
  name: tosholi
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/tosholi-${{ version }}.tar.gz
  sha256: 326ca4b8d8310b32af99e8be73a3b6628b30f3c8b4dbb8e7bc60e42a25a91a52

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64.0
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - dacite
    - tomli
    - tomli-w

tests:
  - python:
      imports:
        - tosholi
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Read and write TOML config files with dataclasses.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/gpauloski/tosholi

extra:
  recipe-maintainers:
    - jan-janssen
